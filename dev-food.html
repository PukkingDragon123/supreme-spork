<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boondee food sheet</title>
    <style>
      body { margin: 0; font: 12px 'Mali', sans-serif; background: #e9dccb; color: #3a2838; }
      h2 { margin: 12px 12px 4px; font-size: 14px; }
      .sheet { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 12px; }
      .sheet.light { background: #fff4e2; }
      .sheet.dark { background: #2a2233; color: #e8dcc8; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 3px; width: 96px; }
      .cell .imgs { display: flex; align-items: flex-end; gap: 4px; }
      .cell span { font-size: 9px; opacity: 0.75; max-width: 96px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      canvas { image-rendering: pixelated; }
      .zoom .cell { width: auto; }
    </style>
  </head>
  <body>
    <div id="g"></div>
    <script type="module" src="/src/dev/food.ts"></script>
  </body>
</html>
