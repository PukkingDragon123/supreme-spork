<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Boondee · prayer hall (dev)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1220; color: #fff1d6; font: 12px/1.3 system-ui, sans-serif; overflow: hidden; }
      #host { position: absolute; inset: 0; }
      .pixel-canvas { image-rendering: pixelated; }
      #panel { position: absolute; right: 6px; top: 6px; width: 176px; max-height: calc(100% - 12px); overflow: auto; background: rgba(26, 18, 32, 0.82); border: 1px solid #5a3d4f; border-radius: 8px; padding: 6px; z-index: 5; }
      #panel.hidden > :not(.toggle) { display: none; }
      #panel h4 { margin: 6px 0 3px; font-size: 11px; color: #ffd54f; text-transform: uppercase; letter-spacing: 0.04em; }
      #panel button { font: inherit; margin: 1px; padding: 3px 6px; border-radius: 5px; border: 1px solid #7a5a6a; background: #3a2838; color: #fff1d6; cursor: pointer; }
      #panel button.on { background: #b8742a; border-color: #ffd54f; }
      #panel input[type='range'] { width: 100%; }
      .zones { position: absolute; left: 0; right: 0; pointer-events: none; z-index: 3; }
      .zones.top { top: 0; height: 12%; background: rgba(90, 160, 255, 0.18); border-bottom: 1px dashed #9fd0ff; }
      .zones.bot { bottom: 0; height: 35%; background: rgba(90, 160, 255, 0.18); border-top: 1px dashed #9fd0ff; }
      #inspect { position: absolute; inset: 0; overflow: auto; display: none; background: #2b1a22; padding: 8px; }
      #inspect canvas { image-rendering: pixelated; margin: 4px; vertical-align: bottom; }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <div id="inspect"></div>
    <div id="panel"></div>
    <script type="module" src="/src/dev/prayer.ts"></script>
  </body>
</html>
