<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boondee cutscenes (dev)</title>
    <style>
      body { background: #1b1528; color: #fff1d6; font-family: 'Mitr', sans-serif; margin: 0; }
      .bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; align-items: center; }
      .bar button, .bar select, .bar label { font: inherit; font-size: 13px; }
      .bar button { background: #3a2838; color: #fff1d6; border: 2px solid #6b4d5e; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
      .bar button.on { background: #e9a53a; color: #3a2838; border-color: #fff3a6; }
      .wrap { display: flex; justify-content: center; padding: 8px; }
      #box { position: relative; overflow: hidden; background: #000; box-shadow: 0 0 0 2px #6b4d5e; }
      #box canvas { image-rendering: pixelated; }
      #cap { position: absolute; left: 0; right: 0; bottom: 9%; text-align: center; pointer-events: none;
        font-size: 19px; font-weight: 500; color: #fff6e4; letter-spacing: 0.5px;
        text-shadow: 0 2px 0 #3a2838, 2px 0 0 #3a2838, -2px 0 0 #3a2838, 0 -2px 0 #3a2838, 0 4px 0 rgba(0,0,0,.35);
        transition: opacity .35s; opacity: 0; padding: 0 16px; }
      #cap.on { opacity: 1; }
      #skip { position: absolute; right: 10px; top: 10px; font: inherit; font-size: 12px; background: rgba(58,40,56,.6); color: #fff1d6; border: 1px solid #fff1d6; border-radius: 12px; padding: 2px 10px; }
      #panels { position: absolute; left: 16px; right: 16px; bottom: 16px; display: none; flex-direction: column; gap: 10px; }
      #panels div { background: #fff6e4; border: 3px solid #3a2838; border-radius: 8px; height: 54px; opacity: .95; }
      #logo { position: absolute; border: 1px dashed #ff5a8a; pointer-events: none; display: none; }
      #info { font-size: 12px; opacity: .7; padding: 0 8px; }
      #skip, #cap, #panels, #logo { z-index: 2; }
    </style>
  </head>
  <body>
    <div class="bar" id="bar"></div>
    <div id="info"></div>
    <div class="wrap"><div id="box"><div id="logo"></div><div id="panels"><div></div><div></div><div style="height:40px"></div></div><div id="cap"></div><button id="skip">ข้าม ›</button></div></div>
    <script type="module" src="/src/dev/cutscene.ts"></script>
  </body>
</html>
