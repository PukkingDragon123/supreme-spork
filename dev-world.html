    <style>

      #sprites canvas { image-rendering: pixelated; margin: 4px; vertical-align: bottom; background: #86c95f; }
      #log { position: absolute; left: 4px; bottom: 90px; color: #fff; font: 11px monospace; pointer-events: none; text-shadow: 0 1px 0 #000; }
